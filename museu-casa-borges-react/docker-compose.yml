# PostgreSQL para desenvolvimento — dados persistidos no volume Docker `postgres_data`.
# Uso: docker compose up -d
# Depois: defina DATABASE_URL no .env (veja env.docker.example) e rode npx prisma migrate deploy ou db push

services:
  postgres:
    image: postgres:16-alpine
    container_name: museu-casa-borges-db
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-museu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museu_dev_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-museu_casa_borges}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    name: museu_casa_borges_postgres_data
